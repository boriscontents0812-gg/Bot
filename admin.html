<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — iMessage Video Generator</title>
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --background: #181716;
    --foreground: #f4f4f2;
    --card: #242220;
    --primary: #ff4088;
    --primary-fg: #ffffff;
    --muted-fg: #f4f4f29e;
    --border: #f4f4f217;
    --input: #201f1e;
    --destructive: #ef4444;
    --font-sans: "Plus Jakarta Sans", sans-serif;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff4088, #ff8a5c) !important;
    box-shadow: 0 4px 16px rgba(255,64,136,0.3) !important;
  }

  html, body { height: 100%; background: var(--background); color: var(--foreground);
    font-family: var(--font-sans); -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 40px 36px; width: 100%; max-width: 360px;
    box-shadow: 0 4px 24px rgba(0,0,0,.06); display: flex; flex-direction: column;
    align-items: center; gap: 24px; }
  .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { font-size: 13px; color: var(--muted-fg); margin-top: -16px; }
  .form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  input[type="password"] { width: 100%; height: 46px; padding: 0 14px;
    background: var(--input); border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; color: var(--foreground); outline: none;
    font-family: var(--font-sans);
    transition: border-color .15s, box-shadow .15s; }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px oklch(0.62 0.19 258 / 15%); }
  .btn { width: 100%; height: 46px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--primary); color: var(--primary-fg); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg { font-size: 13px; color: var(--destructive); text-align: center; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">Admin Panel</div>
    <div class="sub">iMessage Video Generator</div>
    <form class="form" onsubmit="doLogin(event)">
      <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password" />
      <button class="btn btn-primary" id="btn" type="submit">Sign in</button>
      <div class="error-msg" id="err"></div>
    </form>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const pw = document.getElementById('pw').value;
      if (!pw) { err.textContent = 'Enter password'; return; }
      btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) { window.location.href = '/admin'; }
        else {
          const d = await res.json().catch(() => ({}));
          err.textContent = d.detail || 'Wrong password';
          btn.disabled = false; btn.textContent = 'Sign in';
        }
      } catch { err.textContent = 'Connection error'; btn.disabled = false; btn.textContent = 'Sign in'; }
    }
  </script>
</body>
</html>
